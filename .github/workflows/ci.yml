name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[validate]"
          pip install black pylint mypy pytest pytest-cov
      - name: Check formatting (black)
        run: black --check --config config/tools/black.toml src/ tests/
      - name: Run linter (pylint)
        run: pylint --rcfile=config/tools/pylintrc.ini src/
      - name: Run type checker (mypy)
        run: mypy --config-file config/tools/mypy.ini src/
      - name: Run tests
        run: pytest tests/ -v --cov --cov-report=xml
      - name: Run doctests
        run: pytest --doctest-modules src/elenchos
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  profile-package:
    # The TypeScript implementation of the findings profile, which runs the vectors of specs/vectors/.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/profile
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: packages/profile/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Check formatting (prettier)
        run: npm run format:check
      - name: Run linter (eslint)
        run: npm run lint
      - name: Run type checker (tsc)
        run: npm run typecheck
      - name: Run tests
        run: npm test
      - name: Check the tarball
        run: npm pack --dry-run
