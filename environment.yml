name: elenchos
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.12
  # Development tools
  - black                  # code formatting
  - mypy                   # static type checking
  - mypy_extensions
  - pylint                 # code linting
  - pyright                # static type analysis
  # Testing
  - pytest
  - pytest-mock
  - pytest-cov
  - pytest-pylint          # Pylint plugin for Pytest
  - jsonschema             # validation of a log against the profile, and of a record against its schema
  - referencing            # resolution of the absolute $id of a schema closure
  - pyyaml                 # reading of the registry and of the records
  # CLI
  - typer                  # command line interface
  - rich                   # terminal output formatting
variables:
