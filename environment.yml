name: elenchos
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.12
  # Development tools
  - black                  # code formatting
  - mypy                   # static type checking
  - mypy_extensions
  - pylint                 # code linting
  - pyright                # static type analysis
  # Testing
  - pytest
  - pytest-mock
  - pytest-cov
  - pytest-pylint          # Pylint plugin for Pytest
  - jsonschema             # agreement of the published schemas with the loaders
  # CLI
  - typer                  # command line interface
  - rich                   # terminal output formatting
variables:
